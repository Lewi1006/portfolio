<section class="skills">
  <div class="content">
    <div class="skills__wrapper">
      <div class="skills__frame"></div>
      <h2>My skills</h2>
      <div class="skills__content">
        <div class="skills__icons">
          @for (currentSkill of skillList; track currentSkill.id) {
            <div class="skills__icon">
              <img [src]="currentSkill.icon" [alt]="currentSkill.name" />
              <p>{{ currentSkill.name }}</p>
            </div>
          }
        </div>
        <div class="skills__contact">
          <img src="assets/icons/skills.svg" alt="/" />
          <p>Don’t see the skill you need? <span>Contact me!</span> I’m always ready to learn!</p>
        </div>
      </div>
    </div>
  </div>
</section>
