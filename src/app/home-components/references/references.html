<section class="ref">
  <div class="content">
    <div class="ref-wrapper">
      <div class="ref-headline">
        <h2>References</h2>
        <p class="ref-intro">
          I thriveI thrive both independently and as part of a team. Here’s what my colleagues have
          to say about working with me.
        </p>
      </div>

      <div class="ref-card-wrapper">
      @for (currentRef of reference; track currentRef.id) {
          <div class="ref-card">
            <img [src]= "currentRef.img" [alt]="'quotation marks'" />
            <div class="ref-card-title">
              <h3>{{currentRef.name}}</h3>
              <p>{{currentRef.role}}</p>
            </div>
            <p class="ref-card-text">{{currentRef.text}}</p>
          </div>
        }
      </div>
    </div>
  </div>
</section>
