<section class="ref">
  <div class="content">
    <div class="ref-wrapper">
      <div class="ref-headline">
        <h2>{{'references.title' | translate}}</h2>
        <p class="ref-intro">
          {{'references.description' | translate}}
        </p>
      </div>

      <div class="ref-card-wrapper">
      @for (currentRef of reference; track currentRef.id) {
          <div class="ref-card">
            <img [src]= "currentRef.img" [alt]="'quotation marks'" />
            <div class="ref-card-title">
              <h3>{{currentRef.nameKey | translate}}</h3>
              <p>{{currentRef.roleKey | translate}}</p>
            </div>
            <p class="ref-card-text">{{currentRef.textKey | translate}}</p>
          </div>
        }
      </div>
    </div>

    <div class="arrow-left">
      <img src="assets/icons/arrow_left.svg" alt="arrow left" />
    </div>
  </div>
</section>
