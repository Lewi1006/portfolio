<section class="contact">
  <div class="content">
    <div class="contact-wrapper">
      <h2>Say Hi!</h2>

      <form class="contact-form">
        <div class="contact-form-headline">
          <h3>Want to discuss a new project?</h3>
          <p>Say hello! let's discuss your ideas and make it happen</p>
        </div>

        <div class="contact-field">
          <label for="name">Name</label>
          <input id="name" type="text" name="name" placeholder="Your name" />
        </div>

        <div class="contact-field">
          <label for="email">Email</label>
          <input id="email" type="email" name="email" placeholder="Your email" />
        </div>

        <div class="contact-field contact-field-message">
          <label for="message">Message</label>
          <textarea id="message" name="message" placeholder="Your message"></textarea>
        </div>

        <div class="contact-consent">
          <input id="privacy" type="checkbox" name="privacy" />
          <label for="privacy">
            I've read the <span>privacy policy</span> and agree to the processing of my data as
            outlined.
          </label>
        </div>

        <button class="contact-btn" type="submit">Send message</button>
      </form>
    </div>
  </div>
</section>
