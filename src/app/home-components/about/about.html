<section class="about">
  <div class="content">
    <div class="about-wrapper">
      <h2>{{ 'about.title' | translate }}</h2>
      <div class="about-content">
        <div class="about-text">
          <p>
            {{ 'about.description' | translate }}
          </p>

          <div class="about-details">
            <div class="about-detail">
              <img src="assets/icons/house.svg" alt="" />
              <p>{{ 'about.location' | translate }}</p>
            </div>
            <div class="about-detail">
              <img src="assets/icons/laptop.svg" alt="" />
              <p>{{ 'about.remote' | translate }}</p>
            </div>
          </div>

          <button class="about-button" type="button">{{ 'about.button' | translate }}</button>
        </div>

        <div class="about-img">
          <img src="assets/img/leonie_wind_cropped.jpg" alt="Leonie Wind" />
        </div>
      </div>
    </div>

    <div class="arrow-left">
      <div class="arrow-img">
        <img src="assets/icons/arrow_left.svg" alt="arrow left" />
      </div>
    </div>
  </div>
</section>
